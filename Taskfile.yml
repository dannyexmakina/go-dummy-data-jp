version: "3"

vars:
  APP: dummy-data-jp
  BUILD_DIR: build

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: 現在の環境向けにビルド
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - "{{.BUILD_DIR}}/{{.APP}}{{exeExt}}"
    cmds:
      - go build -trimpath -ldflags "-s -w" -o {{.BUILD_DIR}}/{{.APP}}{{exeExt}} ./cmd

  build:all:
    desc: 各OS/アーキテクチャ向けにクロスビルド
    cmds:
      - for: [darwin/arm64, darwin/amd64, linux/amd64, linux/arm64, windows/amd64]
        task: build:target
        vars:
          TARGET: "{{.ITEM}}"

  build:target:
    internal: true
    vars:
      GOOS: '{{index (splitList "/" .TARGET) 0}}'
      GOARCH: '{{index (splitList "/" .TARGET) 1}}'
      EXT: '{{if eq .GOOS "windows"}}.exe{{end}}'
    env:
      GOOS: "{{.GOOS}}"
      GOARCH: "{{.GOARCH}}"
      CGO_ENABLED: "0"
    cmds:
      - go build -trimpath -ldflags "-s -w" -o {{.BUILD_DIR}}/{{.APP}}-{{.GOOS}}-{{.GOARCH}}{{.EXT}} ./cmd

  vet:
    desc: go vet と gofmt チェック
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)"

  run:
    desc: "実行 (例: task run -- -n 5)"
    cmds:
      - go run ./cmd {{.CLI_ARGS}}

  clean:
    desc: ビルド成果物を削除
    cmds:
      - rm -rf {{.BUILD_DIR}}/*
